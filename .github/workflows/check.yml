name: Check channel

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-summary
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check videos and email summaries
        run: python check.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPADATA_KEY: ${{ secrets.SUPADATA_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Save processed videos
        if: always()
        run: |
          if [ -f seen.txt ]; then
            git config user.name "summary-bot"
            git config user.email "summary-bot@users.noreply.github.com"
            git add seen.txt
            if ! git diff --cached --quiet; then
              git commit -m "Update processed videos"
              git push
            fi
          fi
